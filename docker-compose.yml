services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: gsm_api
      POSTGRES_USER: gsm_api
      POSTGRES_PASSWORD: gsm_api_local
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gsm_api -d gsm_api"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data:
