services:
  api:
    image: ${API_IMAGE:?Set API_IMAGE to an immutable GHCR digest}
    restart: unless-stopped
    ports:
      - "${API_PORT:-8082}:8080"
    environment:
      PORT: "8080"
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL}
      CLIENT_ID: ${CLIENT_ID:?Set CLIENT_ID}
      CLIENT_SECRET: ${CLIENT_SECRET:?Set CLIENT_SECRET}
      NOMINATIM_URL: https://nominatim.openstreetmap.org
      OSRM_URL: https://router.project-osrm.org
      WEBHOOK_URL: ${WEBHOOK_URL:-}
      WEBHOOK_SIGNING_KEY: ${WEBHOOK_SIGNING_KEY:-}
      GOMEMLIMIT: 96MiB
      GOMAXPROCS: "1"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 64
    stop_grace_period: 15s
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:8080/healthz]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
  postgres:
    image: postgres:18-alpine@sha256:77f585114c32fbca283dc835b0596f4e52b51b4c6662d7810b2f4084f60a1873
    restart: unless-stopped
    environment:
      POSTGRES_DB: gsm_api
      POSTGRES_USER: gsm_api
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    command:
      - postgres
      - -c
      - shared_buffers=16MB
      - -c
      - max_connections=30
      - -c
      - work_mem=1MB
      - -c
      - maintenance_work_mem=16MB
    volumes:
      - postgres_data:/var/lib/postgresql
    shm_size: 32m
    mem_limit: 160m
    cpus: 0.5
    pids_limit: 64
    healthcheck:
      test: [CMD-SHELL, pg_isready -U gsm_api -d gsm_api]
      interval: 5s
      timeout: 3s
      retries: 12
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  postgres_data:
